name: Minecraft Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng của GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Cơ chế lưu giữ thư mục plugins (Cache) để giữ nguyên plugin tự thêm
      - name: Cache Minecraft Plugins
        uses: actions/cache@v4
        with:
          path: server/plugins
          key: ${{ runner.os }}-minecraft-plugins-${{ hashFiles('server/plugins/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-minecraft-plugins-

      # 2. Khởi tạo thư mục server & tải file server gốc nếu chưa có
      - name: Setup Server Files & Download Server
        run: |
          if (!(Test-Path "server")) { New-Item -ItemType Directory -Path "server" -Force }
          if (!(Test-Path "server/plugins")) { New-Item -ItemType Directory -Path "server/plugins" -Force }
          
          cd server
          
          if (!(Test-Path "server.jar")) {
              Write-Output "Dang tai Purpur 1.20.4..."
              Invoke-WebRequest -Uri "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download" -OutFile "server.jar"
          }
          
          if (!(Test-Path "eula.txt")) {
              "eula=true" | Out-File -Encoding utf8 eula.txt
          }

      # 3. Tải GeyserMC & Floodgate cho cross-play (chỉ tải nếu chưa có sẵn)
      - name: Download Default Core Plugins (Geyser & Floodgate)
        run: |
          if (!(Test-Path "server/plugins")) { New-Item -ItemType Directory -Path "server/plugins" -Force }
          cd server/plugins
          
          if (!(Test-Path "Geyser-Spigot.jar")) {
              Write-Output "Dang tai GeyserMC..."
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" -OutFile "Geyser-Spigot.jar"
          }

          if (!(Test-Path "floodgate.jar")) {
              Write-Output "Dang tai Floodgate..."
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -OutFile "floodgate.jar"
          }

      # 4. Chạy Playit.gg dạng Background Job liên tục & in link claim trực tiếp
      - name: Run Playit.gg & Show Link Clearly
        run: |
          cd server
          
          if (!(Test-Path "playit.exe")) {
              Write-Output "Dang tai Playit.exe..."
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -OutFile "playit.exe"
          }
          
          if (Test-Path "playit.toml") { Remove-Item "playit.toml" }
          if (Test-Path "playit_out.txt") { Remove-Item "playit_out.txt" }

          Write-Output "========================================"
          Write-Output "DANG KHOI DONG PLAYIT VA LAY LINK..."
          Write-Output "========================================"

          # Dùng Start-Job với đường dẫn cố định để duy trì agent luôn online
          $workDir = (Get-Location).Path
          Start-Job -ScriptBlock {
              param($dir)
              Set-Location $dir
              .\playit.exe --secret_path playit.toml > playit_out.txt 2>&1
          } -ArgumentList $workDir | Out-Null

          # Đợi 10 giây để agent kết nối thành công với server của Playit
          Start-Sleep -Seconds 10

          if (Test-Path "playit_out.txt") {
              Write-Output "========================================="
              Write-Output "=== LINK CLAIM CUA PLAYIT XUAT HIEN DUOI DONG NAY ==="
              Get-Content "playit_out.txt" | Select-String "https://playit.gg/claim/"
              Write-Output "========================================="
              Write-Output "Nhat log chi tiet:"
              Get-Content "playit_out.txt"
          } else {
              Write-Output "Chua thay file log playit!"
          }

      # 5. Khởi chạy Server Minecraft (Giữ tiến trình liên tục)
      - name: Run Minecraft Server (Keep-Alive - Blocking Execution)
        run: |
          cd server
          Write-Output "========================================"
          Write-Output "BAT DAU CHAY SERVER MINECRAFT..."
          Write-Output "========================================"
          
          java -Xms2G -Xmx6G -jar server.jar nogui
