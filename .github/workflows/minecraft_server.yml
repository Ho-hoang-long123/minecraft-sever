name: Minecraft Modded Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Chỉ cache World và Playit config
      - name: Cache Minecraft World
        uses: actions/cache@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
          key: ${{ runner.os }}-minecraft-world-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-minecraft-world-

      - name: Cache Playit Config
        uses: actions/cache@v4
        with:
          path: server/playit.toml
          key: ${{ runner.os }}-playit-config-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-playit-config-

      # 2. Cài đặt Server Fabric & Tải Fabric API có kiểm tra chống lỗi hỏng file
      - name: Setup Fabric Server & Safe Mods
        run: |
          if (!(Test-Path "server")) { New-Item -ItemType Directory -Path "server" -Force }
          if (!(Test-Path "server/mods")) { New-Item -ItemType Directory -Path "server/mods" -Force }
          
          cd server
          
          # Xóa sạch file mod cũ để làm mới hoàn toàn
          if (Test-Path "mods") { Remove-Item -Path "mods\*" -Recurse -Force -ErrorAction SilentlyContinue }

          # Cài đặt Fabric Server 1.20.4
          if (!(Test-Path "fabric-server-launch.jar")) {
              Write-Output "Dang tai Fabric Installer..."
              curl.exe -sL "https://maven.fabricmc.net/net/fabricmc/fabric-installer/0.11.2/fabric-installer-0.11.2.jar" -o "fabric-installer.jar"
              
              Write-Output "Dang cai dat Fabric Server 1.20.4..."
              java -jar fabric-installer.jar server -mcversion 1.20.4 -downloadMinecraft
          }
          
          if (!(Test-Path "eula.txt")) {
              "eula=true" | Out-File -Encoding utf8 eula.txt
          }

          # Tải Fabric API từ Maven chính thức với đường dẫn chuẩn mã hóa %2B
          if (!(Test-Path "mods")) { New-Item -ItemType Directory -Path "mods" -Force }
          cd mods
          
          Write-Output "Dang tai Fabric API..."
          curl.exe -sL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.92.2%2B1.20.4/fabric-api-0.92.2%2B1.20.4.jar" -o "fabric-api.jar"
          
          # KIỂM TRA AN TOÀN: Nếu file tải về bị lỗi/nhỏ hơn 50KB, tự động đổi sang nguồn dự phòng GitHub
          $fileSize = (Get-Item "fabric-api.jar").Length
          if ($fileSize -lt 50000) {
              Write-Output "Phat hien file tai bi loi (chi co $fileSize bytes). Dang doi sang nguon du phong GitHub..."
              Remove-Item "fabric-api.jar" -Force
              curl.exe -sL "https://github.com/FabricMC/fabric/releases/download/0.92.2%2B1.20.4/fabric-api-0.92.2+1.20.4.jar" -o "fabric-api.jar"
          }
          cd ..

      # 3. Chạy Playit & Server Fabric đồng thời
      - name: Run Playit & Minecraft Modded Server Together
        run: |
          cd server
          
          if (!(Test-Path "playit.exe")) {
              Write-Output "Dang tai Playit.exe..."
              curl.exe -sL "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -o "playit.exe"
          }

          Write-Output "========================================"
          Write-Output "KHOI DONG PLAYIT AGENT..."
          Write-Output "========================================"

          Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret_path playit.toml" -RedirectStandardOutput "playit_out.txt" -RedirectStandardError "playit_err.txt"
          
          Write-Output "Dang doi Playit thiet lap ket noi mang (15 giay)..."
          Start-Sleep -Seconds 15

          if (Test-Path "playit_out.txt") {
              Write-Output "=== LOG PLAYIT ==="
              Get-Content "playit_out.txt"
          }

          Write-Output "========================================"
          Write-Output "BAT DAU CHAY SERVER MODDED FABRIC..."
          Write-Output "========================================"
          
          java -Xms2G -Xmx6G -jar fabric-server-launch.jar nogui
          
