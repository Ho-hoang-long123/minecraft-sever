name: Minecraft Modded Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Lưu giữ thư mục MODS để giữ các mod bạn tự thêm
      - name: Cache Minecraft Mods
        uses: actions/cache@v4
        with:
          path: server/mods
          key: ${{ runner.os }}-minecraft-mods-${{ hashFiles('server/mods/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-minecraft-mods-

      # 2. Lưu giữ Thế Giới (World) để không bị mất map cũ
      - name: Cache Minecraft World
        uses: actions/cache@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
          key: ${{ runner.os }}-minecraft-world-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-minecraft-world-

      # 3. Lưu cấu hình Playit để giữ nguyên IP cũ (Không cần claim lại)
      - name: Cache Playit Config
        uses: actions/cache@v4
        with:
          path: server/playit.toml
          key: ${{ runner.os }}-playit-config-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-playit-config-

      # 4. Tự động cài đặt Fabric 1.20.4 & Tải Fabric API (có kèm User-Agent chống chặn)
      - name: Setup Fabric Server & Core Mods
        run: |
          if (!(Test-Path "server")) { New-Item -ItemType Directory -Path "server" -Force }
          if (!(Test-Path "server/mods")) { New-Item -ItemType Directory -Path "server/mods" -Force }
          
          cd server
          
          # Tải và chạy Fabric Installer chính thức để tự sinh ra file fabric-server-launch.jar
          if (!(Test-Path "fabric-server-launch.jar")) {
              Write-Output "Dang tai Fabric Installer..."
              $userAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              Invoke-WebRequest -Uri "https://maven.fabricmc.net/net/fabricmc/fabric-installer/0.11.2/fabric-installer-0.11.2.jar" -UserAgent $userAgent -OutFile "fabric-installer.jar"
              
              Write-Output "Dang cai dat Fabric Server 1.20.4..."
              java -jar fabric-installer.jar server -mcversion 1.20.4 -downloadMinecraft
          }
          
          if (!(Test-Path "eula.txt")) {
              "eula=true" | Out-File -Encoding utf8 eula.txt
          }

          # Tải Fabric API có kèm User-Agent để vượt tường lửa Modrinth
          cd mods
          if (!(Test-Path "fabric-api.jar")) {
              Write-Output "Dang tai Fabric API..."
              $userAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              Invoke-WebRequest -Uri "https://cdn.modrinth.com/data/P7dR8mSH/versions/9q02uVw8/fabric-api-0.92.2%2B1.20.4.jar" -UserAgent $userAgent -OutFile "fabric-api.jar"
          }
          cd ..

      # 5. Chạy Playit & Server Fabric đồng thời
      - name: Run Playit & Minecraft Modded Server Together
        run: |
          cd server
          
          if (!(Test-Path "playit.exe")) {
              Write-Output "Dang tai Playit.exe..."
              $userAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -UserAgent $userAgent -OutFile "playit.exe"
          }

          Write-Output "========================================"
          Write-Output "KHOI DONG PLAYIT AGENT..."
          Write-Output "========================================"

          # Khởi chạy Playit (tự động nhận diện playit.toml cũ nếu có)
          Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret_path playit.toml" -RedirectStandardOutput "playit_out.txt" -RedirectStandardError "playit_err.txt"
          
          Start-Sleep -Seconds 7

          if (Test-Path "playit_out.txt") {
              Write-Output "=== LOG PLAYIT ==="
              Get-Content "playit_out.txt" | Select-String "https://playit.gg/claim/" -Quiet
              if ($?) {
                  Get-Content "playit_out.txt"
              } else {
                  Write-Output "Playit da tu dong ket noi lai voi cau hinh cu thanh cong!"
              }
          }

          Write-Output "========================================"
          Write-Output "BAT DAU CHAY SERVER MODDED FABRIC..."
          Write-Output "========================================"
          
          java -Xms2G -Xmx6G -jar fabric-server-launch.jar nogui
          
