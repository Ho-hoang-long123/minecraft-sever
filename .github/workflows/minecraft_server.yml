name: Minecraft Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng của GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Server Files & Download PaperMC
        run: |
          if (!(Test-Path "server")) { mkdir server }
          if (!(Test-Path "server/plugins")) { mkdir server/plugins }
          
          cd server
          
          if (!(Test-Path "server.jar")) {
              Write-Output "Dang tai PaperMC 1.20.4 truc tiep..."
              # Endpoint mirror trực tiếp chuẩn xác, không sợ lỗi API
              Invoke-WebRequest -Uri "https://papermc.io/api/v1/paper/1.20.4/latest/download" -OutFile "server.jar"
          }
          
          if (!(Test-Path "eula.txt")) {
              "eula=true" | Out-File -Encoding utf8 eula.txt
          }

      - name: Download Plugins & GeyserMC
        run: |
          cd server/plugins
          
          if (!(Test-Path "Geyser-Spigot.jar")) {
              Write-Output "Dang tai GeyserMC va Floodgate cho Cross-play..."
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" -OutFile "Geyser-Spigot.jar"
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -OutFile "floodgate.jar"
          }

          if (!(Test-Path "EssentialsX.jar")) {
              Write-Output "Dang tai EssentialsX..."
              Invoke-WebRequest -Uri "https://github.com/EssentialsX/EssentialsX/releases/download/2.20.1/EssentialsX-2.20.1.jar" -OutFile "EssentialsX.jar"
          }

      - name: Setup Playit.gg Tunnel
        run: |
          cd server
          if (!(Test-Path "playit.exe")) {
              Write-Output "Dang tai Playit.gg..."
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -OutFile "playit.exe"
          }
          # Chạy ngầm playit để tạo IP/Port công khai
          Start-Process -FilePath ".\playit.exe"

      - name: Run Minecraft Server (Blocking Execution - Keep Active)
        run: |
          cd server
          Write-Output "========================================"
          Write-Output "BAT DAU CHAY SERVER MINECRAFT..."
          Write-Output "Workflow se giu nguyen trang thai nay (Khong Complete Job) cho den khi het 6 tieng."
          Write-Output "========================================"
          
          # Lệnh chạy trực tiếp (Foreground). Giúp terminal không bị đóng và giữ active liên tục.
          java -Xms2G -Xmx6G -jar server.jar nogui
