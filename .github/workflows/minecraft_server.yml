name: Minecraft Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Server Files & Download Server
        run: |
          if (!(Test-Path "server")) { New-Item -ItemType Directory -Path "server" -Force }
          if (!(Test-Path "server/plugins")) { New-Item -ItemType Directory -Path "server/plugins" -Force }
          
          cd server
          
          if (!(Test-Path "server.jar")) {
              Write-Output "Dang tai Purpur 1.20.4..."
              Invoke-WebRequest -Uri "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download" -OutFile "server.jar"
          }
          
          if (!(Test-Path "eula.txt")) {
              "eula=true" | Out-File -Encoding utf8 eula.txt
          }

      - name: Download GeyserMC & Floodgate
        run: |
          if (!(Test-Path "server/plugins")) { New-Item -ItemType Directory -Path "server/plugins" -Force }
          cd server/plugins
          
          if (!(Test-Path "Geyser-Spigot.jar")) {
              Write-Output "Dang tai GeyserMC..."
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" -OutFile "Geyser-Spigot.jar"
          }

          if (!(Test-Path "floodgate.jar")) {
              Write-Output "Dang tai Floodgate..."
              Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -OutFile "floodgate.jar"
          }

      - name: Run Playit.gg & Show Claim Link
        run: |
          # Lấy đường dẫn tuyệt đối của thư mục server hiện tại để tránh lỗi đường dẫn
          $serverDir = Resolve-Path "server"
          
          if (!(Test-Path "$serverDir\playit.exe")) {
              Write-Output "Dang tai Playit.exe..."
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -OutFile "$serverDir\playit.exe"
          }
          
          if (Test-Path "$serverDir\playit.toml") { Remove-Item "$serverDir\playit.toml" }

          Write-Output "========================================"
          Write-Output "KHOI DONG PLAYIT.GG..."
          Write-Output "========================================"
          
          # Chạy background job với đường dẫn tuyệt đối chuẩn xác
          $job = Start-Job -ScriptBlock {
              param($dir)
              Set-Location $dir
              .\playit.exe
          } -ArgumentList $serverDir
          
          # Đợi 8 giây để playit kết nối và sinh link claim
          Start-Sleep -Seconds 8
          
          # Lấy log và in thẳng ra màn hình GitHub Actions
          $output = Receive-Job -Job $job
          Write-Output "--- KET QUA PLAYIT LOG ---"
          Write-Output $output

      - name: Run Minecraft Server (Keep-Alive - Blocking Execution)
        run: |
          cd server
          Write-Output "========================================"
          Write-Output "BAT DAU CHAY SERVER MINECRAFT..."
          Write-Output "Workflow se GIỮ NGUYÊN trạng thái này, KHÔNG COMPLETE JOB cho đến hết 6 tiếng."
          Write-Output "========================================"
          
          java -Xms2G -Xmx6G -jar server.jar nogui
