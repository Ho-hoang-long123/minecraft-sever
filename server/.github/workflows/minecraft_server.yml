name: Minecraft Server Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360 # Chạy tối đa 6 tiếng mỗi lần (giới hạn của GitHub)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Server Files & Download PaperMC
        run: |
          mkdir server
          mkdir server/plugins
          cd server
          
          # Tải PaperMC 1.20.4
          Write-Output "Downloading PaperMC..."
          Invoke-WebRequest -Uri "https://api.papermc.v2/projects/paper/versions/1.20.4/builds/496/downloads/paper-1.20.4-496.jar" -OutFile "server.jar"
          
          # Tạo eula.txt nếu chưa có
          "eula=true" | Out-File -Encoding utf8 eula.txt

      - name: Download Plugins (Vượt giới hạn dung lượng 25MB)
        run: |
          cd server/plugins
          
          # --- CÁCH 1: Tải trực tiếp các plugin nhẹ qua link tải trực tiếp (Direct Link) ---
          # Ví dụ tải Floodgate và GeyserMC (để hỗ trợ Bedrock/Điện thoại vào chơi chung với PC)
          Write-Output "Downloading Geyser & Floodgate for Cross-play..."
          Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" -OutFile "Geyser-Spigot.jar"
          Invoke-WebRequest -Uri "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -OutFile "floodgate.jar"

          # --- CÁCH 2: Nếu bạn có plugin nặng / plugin pack > 25MB lưu trên Google Drive / MediaFire ---
          # Hãy thay link bên dưới thành link trực tiếp file .zip chứa toàn bộ plugin của bạn:
          # Write-Output "Downloading heavy plugins pack..."
          # Invoke-WebRequest -Uri "LINK_DIRECT_DOWNLOAD_FILE_ZIP_CUA_BAN" -OutFile "plugins.zip"
          # Expand-Archive -Path "plugins.zip" -DestinationPath "." -Force
          # Remove-Item "plugins.zip"

      - name: Setup Playit.gg (Tạo Tunnel để lấy IP và Port không cần Port Forward)
        run: |
          cd server
          Write-Output "Downloading Playit.gg..."
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -OutFile "playit.exe"
          
          # Chạy ngầm playit.exe
          Start-Process -FilePath ".\playit.exe"

      - name: Start Minecraft Server & Keep-Alive Loop (Chống Idle & Tự khởi động lại khi crash)
        run: |
          cd server
          
          # Hàm khởi động server
          function Start-MCServer {
              return Start-Job -ScriptBlock {
                  java -Xms2G -Xmx6G -jar server.jar nogui
              }
          }

          Write-Output "Starting Minecraft Server..."
          $serverJob = Start-MCServer

          # Vòng lặp giữ kết nối vô cực (Chạy liên tục, cứ 5 phút in log 1 lần để GitHub không ngắt kết nối do rỗi)
          $counter = 1
          while ($true) {
              Start-Sleep -Seconds 300
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              Write-Output "[$time] Keep-Alive check #$counter: Server is active."
              
              # Kiểm tra xem tiến trình server có còn sống không, nếu sập/dừng thì bật lại tự động
              $jobState = (Get-Job -Id $serverJob.Id).State
              if ($jobState -ne 'Running') {
                  Write-Output "[$time] WARNING: Server stopped or crashed! Restarting..."
                  Remove-Job $serverJob -Force
                  $serverJob = Start-MCServer
              }
              
              $counter++
          }
